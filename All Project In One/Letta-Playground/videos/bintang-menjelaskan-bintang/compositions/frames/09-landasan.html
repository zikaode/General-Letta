<script>
(function () {

  var tl = gsap.timeline({ paused: true });

  // Deterministic star positions (30 stars, top ~83% y ≤ 890)

    { x: 1300, y: 350, s: 3, b: 0.5 }, { x: 1500, y: 60, s: 4, b: 0.6 },
    { x: 1650, y: 550, s: 2.5, b: 0.4 }, { x: 1850, y: 250, s: 3.5, b: 0.55 },
    { x: 150, y: 750, s: 4, b: 0.6 }, { x: 1750, y: 700, s: 3, b: 0.5 },
  ];

  var starsContainer = document.getElementById("f09-landasan-stars");
  var starEls = [];
  STAR_DEFS.forEach(function (def) {
    var el = document.createElement("div");
    el.className = "f09-landasan-star";
    el.style.width = def.s + "px"; el.style.height = def.s + "px";
    el.style.left = def.x + "px"; el.style.top = def.y + "px";
    el.style.opacity = "0";
    el.style.transform = "scale(0)";
    starsContainer.appendChild(el);
    starEls.push({ el: el, def: def });

  var beat1 = document.getElementById("f09-landasan-beat1-wrap");
  var beat2 = document.getElementById("f09-landasan-beat2-wrap");
  var beat3 = document.getElementById("f09-landasan-beat3-wrap");
  var accent = document.getElementById("f09-landasan-accent-line");
  var cameraGroup = document.getElementById("f09-landasan-camera-group");

  // ══ SCENE 1 (0.0–1.5s): "BINTANG" enters; few stars pop in ══
  tl.fromTo(beat1, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.960, ease: "power3.out" }, 0.000);
  for (var i = 0; i < 8; i++) {
    tl.fromTo(starEls[i].el, { scale: 0, opacity: 0 }, { scale: 1, opacity: starEls[i].def.b, duration: 0.768, ease: "back.out(1.4)" }, 0.2 + i * 0.1);

  // ══ SCENE 2 (1.5–3.0s): hard-cut to "PABRIK ELEMEN" coral; more stars; accent-line draws ══

  tl.fromTo(beat2, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.864, ease: "power3.out" }, 2.880);
  tl.fromTo(accent, { transform: "scaleX(0)", opacity: 1 }, { transform: "scaleX(1)", duration: 1.152, ease: "power2.out" }, 3.456);
  for (var i = 8; i < 18; i++) {
    tl.fromTo(starEls[i].el, { scale: 0, opacity: 0 }, { scale: 1, opacity: starEls[i].def.b, duration: 0.768, ease: "back.out(1.4)" }, 1.6 + (i - 8) * 0.09);
  }

  // ══ SCENE 3 (3.0–4.5s): hard-cut to "ALAM SEMESTA" cream; ~30 stars; slow camera push ══
  tl.set(beat2, { opacity: 0 }, 5.760);
  tl.set(accent, { opacity: 0 }, 5.760);
  tl.fromTo(beat3, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.864, ease: "power3.out" }, 5.760);
  for (var i = 18; i < 30; i++) {
    tl.fromTo(starEls[i].el, { scale: 0, opacity: 0 }, { scale: 1, opacity: starEls[i].def.b, duration: 0.768, ease: "back.out(1.4)" }, 3.1 + (i - 18) * 0.07);
  }
  // Slow camera push underneath
  tl.fromTo(cameraGroup, { scale: 1.0 }, { scale: 1.05, duration: 2.880, ease: "power1.inOut" }, 5.760);

  // ══ SCENE 4 (4.5–6.0s): text fades out; star field holds; jitter on brightest stars ══
  tl.to(beat3, { scale: 1.12, opacity: 0, duration: 1.344, ease: "power2.inOut" }, 8.640);
  // Subtle jitter on brightest stars (finite, deterministic)
  [2, 11, 22].forEach(function (idx, j) {
    var star = starEls[idx].el;
    var origB = starEls[idx].def.b;
    var proxy = { p: 0 };
    tl.to(proxy, { p: Math.PI * 4, duration: 2.880, ease: "none", onUpdate: (function (pr, s, b) {
      return function () {
        s.style.opacity = String(b + Math.sin(pr.p) * 0.12);
      };
    })(proxy, star, origB) }, 8.640);
  });
  
  var genBg = document.getElementById("f09-landasan-imgbg");
  var flatBg = document.getElementById("f09-landasan-bg");
  if (genBg) {
    tl.fromTo(genBg, { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power1.out" }, 0.0);
  }
  if (flatBg) {
    // dim the flat wash so the illustration shows through but the brand tint stays
    tl.to(flatBg, { opacity: 0.25, duration: 0.8, ease: "power1.out" }, 0.0);
  }
  tl.to({}, { duration: DURATION }, 0.000);
  window.__timelines["09-landasan"] = tl;
})();
