<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function () {
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  var DURATION = 2.48;

  var star = document.getElementById("f10-penutup-star");
  var w1 = document.getElementById("f10-penutup-w1");
  var w2 = document.getElementById("f10-penutup-w2");
  var accent = document.getElementById("f10-penutup-accent");

  // ══ SCENE 1 (0.0–0.8s): ink field; single small coral star fades in center ══
  tl.fromTo(star, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.372, ease: "power2.out" }, 0.031);

  // ══ SCENE 2 (0.8–2.0s): the ONE move — phrase fades in per-word stagger; accent draws ══
  tl.fromTo(w1, { opacity: 0, y: 35 }, { opacity: 1, y: 0, duration: 0.341, ease: "power3.out" }, 0.496);
  tl.fromTo(w2, { opacity: 0, y: 35 }, { opacity: 1, y: 0, duration: 0.341, ease: "power3.out" }, 0.651);
  tl.fromTo(accent, { transform: "scaleX(0)", opacity: 1 }, { transform: "scaleX(1)", duration: 0.372, ease: "power2.out" }, 0.930);

  // ══ SCENE 3 (2.0–4.0s): phrase holds dead still; star twinkles (subtle jitter) ══
  var twProxy = { p: 0 };
  tl.to(twProxy, { p: Math.PI * 8, duration: 1.240, ease: "none", onUpdate: function () {
    var s = 1 + Math.sin(twProxy.p) * 0.18;
    star.style.transform = "scale(" + s.toFixed(3) + ")";
    star.style.opacity = String(0.85 + Math.sin(twProxy.p) * 0.15);
  } }, 1.240);

  // Final frame — a gentle settle at the very tail (allowed on final frame)
  tl.to(w1, { opacity: 0.92, duration: 0.248, ease: "power1.inOut" }, 2.170);
  tl.to(w2, { opacity: 0.92, duration: 0.248, ease: "power1.inOut" }, 2.170);
  
  var genBg = document.getElementById("f10-penutup-imgbg");
  var flatBg = document.getElementById("f10-penutup-bg");
  if (genBg) {
    tl.fromTo(genBg, { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power1.out" }, 0.0);
  }
  if (flatBg) {
    // dim the flat wash so the illustration shows through but the brand tint stays
    tl.to(flatBg, { opacity: 0.25, duration: 0.8, ease: "power1.out" }, 0.0);
  }
  tl.to({}, { duration: DURATION }, 0.000);
  window.__timelines["10-penutup"] = tl;
})();
