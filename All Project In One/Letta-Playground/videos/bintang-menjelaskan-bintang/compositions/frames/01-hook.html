<script>
(function () {

  var tl = gsap.timeline({ paused: true });
  var DURATION = 9.60;

  var beat1 = document.getElementById("f01-hook-beat1-wrap");
  var beat2 = document.getElementById("f01-hook-beat2-wrap");
  var beat3 = document.getElementById("f01-hook-beat3-wrap");
  var star = document.getElementById("f01-hook-star-core");
  var ring = document.getElementById("f01-hook-pulse-ring");
  var glow = document.getElementById("f01-hook-glow");
  var b3lines = document.querySelectorAll("#f01-hook-beat3 .f01-hook-b3-line");

  // ══ SCENE 1 (0.0–1.2s): black field; coral dot pulses; "TITIK CAHAYA" fades in small ══
  // Star core entrance pop + subtle pulse (finite)
  tl.fromTo(star, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.768, ease: "power3.out" }, 0.000);
  // subtle jitter on the dot (finite sine, 2 cycles)
  var starProxy = { p: 0 };
  tl.to(starProxy, { p: Math.PI * 4, duration: 2.304, ease: "none", onUpdate: function () {
    var s = Math.sin(starProxy.p) * 0.5 + 1;
    star.style.transform = "scale(" + s.toFixed(3) + ")";
  } }, 0.000);

  // "TITIK CAHAYA" fades in small, cream, offset above center (star sits center)
  tl.fromTo(beat1, { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: 1.152, ease: "power3.out" }, 0.384);

  // ══ SCENE 2 (1.2–2.8s): hard-cut to "BOLA API" coral; star expands; glow blooms; ring draws ══
  tl.set(beat1, { opacity: 0 }, 2.304);
  tl.fromTo(beat2, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.019, ease: "none" }, 2.304);

  // Star dot expands (scale up 1 → 2.2)

  // Coral radial glow blooms behind
  tl.fromTo(glow, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 1.728, ease: "power3.out" }, 2.496);
  // Pulse ring expands outward
  tl.fromTo(ring, { opacity: 0.8, scale: 0.3 }, { opacity: 0, scale: 2.4, duration: 2.304, ease: "power2.out" }, 2.592);

  // ══ SCENE 3 (2.8–5.0s): hard-cut to "BOLA API RAKSASA" hero-title cream; hold ══
  tl.set(beat2, { opacity: 0 }, 5.376);
  tl.set(star, { opacity: 0 }, 5.376);
  tl.set(ring, { opacity: 0 }, 5.376);
  // per-line reveal (staggered)

    tl.fromTo(line, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.960, ease: "power3.out" }, 2.8 + i * 0.18);
  });
  // Glow settles to a static halo (dims slightly, holds)
  tl.to(glow, { opacity: 0.5, duration: 1.536, ease: "power2.inOut" }, 5.568);

  var flatBg = document.getElementById("f01-hook-bg");
