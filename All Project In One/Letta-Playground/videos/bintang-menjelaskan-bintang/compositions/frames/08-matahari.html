  var sunCircle = document.getElementById("f08-matahari-sun-circle");
  var sunFill = document.getElementById("f08-matahari-sun-fill");
  var progressRing = document.getElementById("f08-matahari-progress-ring");
  var orbitPath = document.getElementById("f08-matahari-orbit-path");
  var earthDot = document.getElementById("f08-matahari-earth-dot");
  var timelineLine = document.getElementById("f08-matahari-timeline-line");
  var counter = document.getElementById("f08-matahari-counter");
  var counterComma = document.getElementById("f08-matahari-counter-comma");
  var counterLabel = document.getElementById("f08-matahari-counter-label");
  var counterSub = document.getElementById("f08-matahari-counter-sub");
  var sunLabel = document.getElementById("f08-matahari-sun-label");
  var eyebrow = document.getElementById("f08-matahari-eyebrow");
  var accentLine = document.getElementById("f08-matahari-accent-line");
  var timelineWrap = document.getElementById("f08-matahari-timeline-wrap");
  var bloomGlow = document.getElementById("f08-matahari-bloom-glow");

  // Measure sun circle
  var sunLen = sunCircle.getTotalLength();
  sunCircle.style.strokeDasharray = sunLen;
  sunCircle.style.strokeDashoffset = sunLen;

  // Measure progress ring
  var ringLen = progressRing.getTotalLength();
  progressRing.style.strokeDasharray = ringLen;
  progressRing.style.strokeDashoffset = ringLen;

  // Measure timeline line
  var tlLineLen = timelineLine.getTotalLength();
  timelineLine.style.strokeDasharray = tlLineLen;
  timelineLine.style.strokeDashoffset = tlLineLen;

  // Counter initial state
  counter.textContent = "0";
  counterComma.style.opacity = "0";

  // ── Timeline ──
  var tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines["08-matahari"] = tl;

  // Scene 1 (0.0–1.0s): cream field. Coral sun circle draws on at center-left. Ink label "MATAHARI" above.

  // Eyebrow + accent line fade in
  tl.fromTo(eyebrow, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.843, ease: "power2.out" }, 0.000);
  tl.fromTo(accentLine, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.843, ease: "power2.out" }, 0.211);

  // Sun circle draws on (svg-path-draw)
  tl.to(sunCircle, { strokeDashoffset: 0, duration: 1.685, ease: "power2.out" }, 0.211);

  // Sun fill fades in after stroke completes
  tl.to(sunFill, { fillOpacity: 0.15, duration: 0.843, ease: "power1.out" }, 1.475);

  // MATAHARI label fades in
  tl.fromTo(sunLabel, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.737, ease: "power2.out" }, 1.053);

  // Scene 2 (1.0–3.5s): "4,6" count-up beside sun, "MILIAR TAHUN" beneath. Progress ring sweeps around sun.
  // Horizontal ink timeline draws below with three coral nodes. Tiny cream earth dot orbits sun (finite).

  // Count-up: 0 → 4 (counting-dynamic-scale)
  var state = { value: 0 };
  var START_SCALE = 0.5; // 40-60% of end size
  var COUNT_DUR = 2.0;
  var COUNT_EASE = "power3.out";

  tl.to(state, {
    value: 4,
    duration: COUNT_DUR,
    ease: COUNT_EASE,
    onUpdate: function () {
      counter.textContent = String(Math.round(state.value));
    }
  }, 2.107);

  // Visual growth — scale grows with the count
  tl.fromTo(counter, { scale: START_SCALE }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, 2.107);

  // Comma suffix slides in after count lands
  tl.fromTo(counterComma, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.843, ease: "power2.out" }, 1.0 + COUNT_DUR);

  // Label fades in early (before count peaks)
  tl.fromTo(counterLabel, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 1.053, ease: "power2.out" }, 2.739);

  // Sub label fades in
  tl.fromTo(counterSub, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.843, ease: "power2.out" }, 3.371);

  // Progress ring sweeps around sun (stat-bars-and-fills ring form, svg-path-draw mechanics)
  tl.to(progressRing, { strokeDashoffset: 0, duration: 4.213, ease: "power2.out" }, 2.528);

  // Orbit path fades in
  tl.fromTo(orbitPath, { opacity: 0 }, { opacity: 0.3, duration: 0.843, ease: "power1.out" }, 2.949);

  // Earth dot becomes visible
  tl.fromTo(earthDot, { opacity: 0 }, { opacity: 1, duration: 0.632, ease: "power1.out" }, 3.160);

  // Earth orbit — finite deterministic tween (NOT infinite repeat)
  // The earth dot orbits the sun: rotate around center (180,180) at radius 155
  // We animate rotation of a wrapper concept, but since earthDot is an SVG circle,
  // we use SVG transform attribute via GSAP
  var ORBIT_DUR = 4.0; // covers from ~1.5s to ~5.5s (finite)
  var orbitState = { angle: 0 };
  var orbitRadius = 155;
  var sunCenterX = 180;
  var sunCenterY = 180;

  tl.to(orbitState, {
    angle: 360 * 1.5, // 1.5 full rotations over the tween (finite, deterministic)
    duration: ORBIT_DUR,
    ease: "none",
    onUpdate: function () {
      var rad = (orbitState.angle * Math.PI) / 180;
      var ex = sunCenterX + Math.cos(rad) * orbitRadius;
      var ey = sunCenterY + Math.sin(rad) * orbitRadius;
      earthDot.setAttribute("cx", ex);
      earthDot.setAttribute("cy", ey);
    }
  }, 3.160);

  // Timeline draws (svg-path-draw) — horizontal ink line
  tl.to(timelineLine, { strokeDashoffset: 0, duration: 2.107, ease: "power2.out" }, 3.792);

  // Timeline wrapper fades in
  tl.fromTo(timelineWrap, { opacity: 0 }, { opacity: 1, duration: 0.843, ease: "power1.out" }, 3.371);

  // Scene 3 (3.5–5.0s): counter lands at "4,6"; ring completes; coral glow blooms behind number.
  // Timeline nodes settle.

  // Glow bloom behind counter (ambient-glow-bloom, bloom-and-hold form — scene <3s after bloom)
  tl.fromTo(bloomGlow, { opacity: 0, scale: 0.85 }, { opacity: 0.28, scale: 1, duration: 1.685, ease: "power2.out" }, 7.373);

  // Bounded breathe during hold — finite phase tween, NOT yoyo
  var breathePhase = { p: 0 };
  var BREATHE_DUR = 1.5; // 3.5 + 0.8 = 4.3s start; 4.3 to 5.8s = 1.5s
  var BREATHE_CYCLES = 0.5; // half cycle over the breathe duration (one gentle pulse)
  var GLOW_PEAK = 0.28;
  var OPACITY_AMP = 0.03;
  var SCALE_AMP = 0.02;

  tl.to(breathePhase, {
    p: Math.PI * 2 * BREATHE_CYCLES,
    duration: BREATHE_DUR,
    ease: "none",
    onUpdate: function () {
      var s = Math.sin(breathePhase.p);
      bloomGlow.style.opacity = String(GLOW_PEAK + s * OPACITY_AMP);
      bloomGlow.style.transform = "scale(" + (1 + s * SCALE_AMP) + ")";
    }
  }, 9.059);

  // Scene 4 (5.0–6.0s): hold — counter, sun, timeline read STILL. Earth dot continues finite orbit.
  // (Earth orbit tween runs until ~5.5s, then earth holds its last position — all part of the finite tween)
  // No exit animation (not the final frame).
})();
</script>
