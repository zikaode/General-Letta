    <div id="f06-supernova-label">SUPERNOVA</div>
    <div id="f06-supernova-world" data-layout-allow-overflow>
      <div id="f06-supernova-flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function () {
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  var DURATION = 12.56;

  var world = document.getElementById("f06-supernova-world");
  var star = document.getElementById("f06-supernova-star");
  var flash = document.getElementById("f06-supernova-flash");
  var label = document.getElementById("f06-supernova-label");
  var payoff = document.getElementById("f06-supernova-payoff");

  // Deterministic fragment positions (element particles scatter outward)
  var F_DEFS = [
    { x: 960, y: 454, tx: 150, ty: 100, s: 10, c: "#E85D5D" },
    { x: 960, y: 454, tx: 1750, ty: 80, s: 8, c: "#F5F0E8" },
    { x: 960, y: 454, tx: 1830, ty: 700, s: 12, c: "#E85D5D" },
    { x: 960, y: 454, tx: 90, ty: 620, s: 9, c: "#F5F0E8" },
    { x: 960, y: 454, tx: 400, ty: 880, s: 11, c: "#E85D5D" },
    { x: 960, y: 454, tx: 1500, ty: 900, s: 7, c: "#F5F0E8" },
    { x: 960, y: 454, tx: 300, ty: 300, s: 6, c: "#F5F0E8" },
    { x: 960, y: 454, tx: 1620, ty: 350, s: 10, c: "#E85D5D" },
    { x: 960, y: 454, tx: 640, ty: 60, s: 8, c: "#F5F0E8" },
    { x: 960, y: 454, tx: 1300, ty: 50, s: 9, c: "#E85D5D" },
    { x: 960, y: 454, tx: 760, ty: 920, s: 6, c: "#F5F0E8" },
    { x: 960, y: 454, tx: 1140, ty: 880, s: 8, c: "#E85D5D" },
  ];

  var worldEl = world;
  var frags = [];
  F_DEFS.forEach(function (d) {
    var el = document.createElement("div");
    el.className = "f06-supernova-frag";
    el.style.width = d.s + "px"; el.style.height = d.s + "px";
    el.style.left = d.x + "px"; el.style.top = d.y + "px";
    el.style.background = d.c;
    el.style.opacity = "0";
    worldEl.appendChild(el);
    frags.push({ el: el, def: d });
  });

  // ══ SCENE 1 (0.0–2.0s): TIGHT on bright coral star (camera starts scaled in ~4x on star) ══
  // Camera: world starts scaled 4x centered on the star (960,454)
  tl.fromTo(world, { scale: 4, x: -2880, y: -1362 }, { scale: 4, x: -2880, y: -1362, duration: 0.018, ease: "none" }, 0.000);
  // Star pulses; destabilizes (jitter increases)
  tl.fromTo(star, { scale: 1, opacity: 1 }, { scale: 1, opacity: 1, duration: 0.018, ease: "none" }, 0.000);
  var destabil = { p: 0 };
  tl.to(destabil, { p: Math.PI * 8, duration: 3.589, ease: "none", onUpdate: function () {
    var amp = 0.06 + (destabil.p / (Math.PI * 8)) * 0.25; // amplitude grows 0.06 → 0.31
    var s = 1 + Math.sin(destabil.p * 3) * amp;
    star.style.transform = "scale(" + s.toFixed(3) + ")";
  } }, 0.000);
  tl.fromTo(label, { opacity: 0 }, { opacity: 0.6, duration: 0.897, ease: "power2.out" }, 0.538);

  // ══ SCENE 2 (2.0–3.5s): EXPLOSION — flash; fragments scatter; zoom-out begins ══
  tl.to(star, { scale: 3.5, duration: 0.449, ease: "power3.out" }, 3.589);
  tl.fromTo(flash, { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.628, ease: "power3.out" }, 3.589);
  tl.to(flash, { opacity: 0.0, duration: 2.153, ease: "power2.inOut" }, 4.486);
  // Fragments scatter outward from center
  frags.forEach(function (f, i) {
    tl.fromTo(f.el, { opacity: 0, x: 0, y: 0 }, { opacity: 0.9, x: f.def.tx - 960, y: f.def.ty - 454, duration: 2.333, ease: "power3.out" }, 2.1 + (i % 6) * 0.06);
  });
  // Star fades as it explodes
  tl.to(star, { opacity: 0, scale: 0.3, duration: 1.077, ease: "power2.in" }, 3.947);
  // Camera: decelerating zoom-out 4x → 1x (the single outward move)
  tl.to(world, { scale: 1, x: 0, y: 0, duration: 5.383, ease: "expo.out" }, 3.947);

  // ══ SCENE 3 (3.5–5.5s): zoom-out continues decelerating; stardust field resolves; frame locks ══
  // (the expo.out tween carries through here — deceleration lands ~5.2s)
  // Fragments settle into a slow outward drift
  frags.forEach(function (f, i) {
    tl.to(f.el, { x: (f.def.tx - 960) * 1.08, y: (f.def.ty - 454) * 1.08, duration: 3.589, ease: "power1.out" }, 4.0 + (i % 5) * 0.1);
  });

  // ══ SCENE 4 (5.5–7.0s): payoff label; held read ══
  tl.fromTo(payoff, { opacity: 0, y: 25 }, { opacity: 1, y: 0, duration: 1.256, ease: "power3.out" }, 10.048);
  // subtle drift on fragments (finite, low amplitude)
  frags.forEach(function (f, i) {
    var proxy = { p: 0 };
    tl.to(proxy, { p: Math.PI * 2, duration: 2.512, ease: "none", onUpdate: (function (pr, el, ph) {
      return function () {
        var o = 0.75 + Math.sin(pr.p + ph) * 0.15;
        el.style.opacity = String(o);
      };
    })(proxy, f.el, i * 0.5) }, 10.048);
  });
  
  var genBg = document.getElementById("f06-supernova-imgbg");
  var flatBg = document.getElementById("f06-supernova-bg");
  if (genBg) {
    tl.fromTo(genBg, { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power1.out" }, 0.0);
  }
  if (flatBg) {
    // dim the flat wash so the illustration shows through but the brand tint stays
    tl.to(flatBg, { opacity: 0.25, duration: 0.8, ease: "power1.out" }, 0.0);
  }
  tl.to({}, { duration: DURATION }, 0.000);
  window.__timelines["06-supernova"] = tl;
})();
