    el.style.width = d.s + "px"; el.style.height = d.s + "px";

  var label = document.getElementById("f04-kelahiran-label");
  var core = document.getElementById("f04-kelahiran-core");
  var glow = document.getElementById("f04-kelahiran-glow");
  var connectors = [];

  // ══ SCENE 1 (0.0–1.5s): particles pop in staggered; label fades in ══
  particles.forEach(function (p, i) {
    tl.fromTo(p.el, { scale: 0, opacity: 0 }, { scale: 1, opacity: 0.85, duration: 0.763, ease: "back.out(1.6)" }, 0.1 + i * 0.09);
  });
  tl.fromTo(label, { opacity: 0 }, { opacity: 1, duration: 0.953, ease: "power3.out" }, 0.763);

  // ══ SCENE 2 (1.5–3.5s): particles drift inward; connectors draw; core grows; label crossfades ══

  });
  // Connectors draw (opacity in, staggered)

  tl.set(label, { textContent: "PROTOSTAR" }, 5.529);
